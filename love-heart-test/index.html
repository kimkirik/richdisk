<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6fa8">
<title>너, 나 사랑해? 💗</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;600;800&display=swap');
*{box-sizing:border-box} body{margin:0;min-height:100vh;color:#5a3041;font-family:'Noto Sans KR',sans-serif;background:radial-gradient(circle at 20% 10%,#fff 0,#ffeaf3 30%,#ffd4e5 70%,#ffc4dc 100%)}
.wrap{max-width:680px;margin:auto;padding:22px 16px 60px}.card{background:#fffafcdd;border:1px solid #fff;border-radius:28px;padding:24px;box-shadow:0 18px 50px #d94c8430;backdrop-filter:blur(10px)}
h1,h2{font-family:'Gaegu',cursive;color:#e64283}h1{font-size:42px;margin:6px 0}.heart{font-size:54px;animation:pulse 1.5s infinite}@keyframes pulse{50%{transform:scale(1.12)}}
.sub{line-height:1.8}.pill{display:inline-block;background:#ffe0ec;color:#c93670;border-radius:999px;padding:7px 12px;font-size:13px}.field{width:100%;padding:15px;border:2px solid #ffd0e1;border-radius:16px;font-size:16px;outline:none;margin:8px 0 14px}
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#ff5f9d,#ef3f83);color:#fff;box-shadow:0 8px 20px #e7437a45}.ghost{background:#ffe9f2;color:#b52f65}.row{display:flex;gap:10px;justify-content:space-between}.progress{height:10px;background:#ffe4ef;border-radius:99px;overflow:hidden;margin:14px 0 24px}.bar{height:100%;background:linear-gradient(90deg,#ff7aaa,#e94180)}
.q{font-size:22px;font-weight:800;line-height:1.55;margin:18px 0}.choices{display:grid;gap:10px}.choice{padding:14px;border:2px solid #ffd7e6;border-radius:16px;background:#fff;text-align:left;color:#67384a;font-size:15px}.choice.on{border-color:#f24d8d;background:#fff0f6}.hint{font-size:13px;color:#936477;line-height:1.6}.score{font:700 62px 'Gaegu';color:#e63f81;text-align:center}.type{text-align:center;font:700 30px 'Gaegu';color:#bd2d67}.metric{margin:14px 0}.metricTop{display:flex;justify-content:space-between;font-weight:700}.track{height:9px;background:#f8dce7;border-radius:99px;overflow:hidden}.fill{height:100%;background:#ef5b94}.report{line-height:1.85;background:#fff;border-radius:18px;padding:17px;margin-top:14px}.adult,footer{font-size:12px;color:#9b687a}footer{text-align:center;margin-top:18px}#test,#result{display:none}@media(max-width:480px){.card{padding:19px}.q{font-size:19px}h1{font-size:38px}.score{font-size:52px}}
</style>
</head>
<body>
<main class="wrap">
<section id="startScreen" class="card">
<div class="heart">💗</div><h1>너, 나 사랑해?</h1><span class="pill">성인용 관계·사랑 성향 테스트 · 30문항</span>
<p class="sub">누군가를 떠올리며 답해보세요. 애착, 키스·성적 끌림, 질투, 돌봄, 돈, 갈등, 미래와 노후까지 함께 살펴봅니다.</p>
<input id="name" class="field" maxlength="12" placeholder="떠올릴 사람의 이름 또는 별명">
<p class="adult">※ 만 19세 이상 성인용입니다. 전문 심리검사가 아니라 자기 감정을 돌아보는 재미용 테스트입니다.</p>
<button class="btn primary" style="width:100%" onclick="beginTest()">사랑 테스트 시작하기 💕</button>
</section>
<section id="test" class="card"><div id="counter" class="pill"></div><div class="progress"><div id="bar" class="bar"></div></div><div id="q" class="q"></div><div id="choices" class="choices"></div><p class="hint">답을 고른 뒤 <b>저장하고 다음</b>을 눌러주세요. 이전 문항으로 돌아가 수정할 수도 있어요.</p><div class="row"><button class="btn ghost" onclick="prevQuestion()">← 이전</button><button class="btn primary" onclick="saveNext()">저장하고 다음 →</button></div></section>
<section id="result" class="card"><div class="heart" style="text-align:center">💞</div><h2 style="text-align:center">마음 분석 보고서</h2><div id="who" style="text-align:center"></div><div id="score" class="score"></div><div id="type" class="type"></div><div id="metrics"></div><div id="report"></div><div class="row" style="margin-top:18px"><button class="btn ghost" onclick="restart()">다시 하기</button><button class="btn primary" onclick="window.print()">보고서 저장/인쇄</button></div><footer>자기보고식 응답을 바탕으로 한 오락·자기성찰용 분석이며 전문 심리검사를 대신하지 않습니다.</footer></section>
</main>
<script>
const Q=[
['좋은 음식이나 디저트를 먹으면, 나 혼자 먹기보다 이 사람도 같이 먹었으면 좋겠다는 생각이 든다.','attach'],['멋진 바다나 여행지를 보면, 언젠가 이 사람과 둘이 다시 와보고 싶다.','attach'],['기쁘거나 속상한 일이 생기면 여러 사람 중 이 사람에게 가장 먼저 말하고 싶다.','attach'],['며칠 동안 연락하거나 만나지 못하면, 별일이 없어도 이 사람이 보고 싶어진다.','attach'],['특별한 계획이 없어도 이 사람과 한 공간에서 시간을 보내는 것만으로 편하고 좋다.','attach'],
['둘만 있을 때 손을 잡거나 오래 안고 있고 싶은 마음이 든다.','romance'],['이 사람과 입을 맞추는 상상을 하면 싫거나 어색하기보다 설레고 좋다.','romance'],['이 사람을 친구가 아니라 연인으로 느끼며, 성적으로도 끌린다고 느낀다.','sexual'],['서로 원하고 동의하는 상황이라면 이 사람과 성관계를 맺는 것이 자연스럽고 좋을 것 같다.','sexual'],['이 사람이 나를 정말 좋은 친구라고만 여기고 연애 감정은 없다고 한다면 많이 서운할 것 같다.','romance'],
['이 사람이 다른 사람에게 연애 감정을 보이는 것 같으면 질투가 날 것 같다.','jealous'],['이 사람이 다른 사람과 키스하거나 연인 관계가 되는 모습을 생각하면 마음이 불편할 것 같다.','jealous'],['질투가 나더라도 이 사람의 휴대폰을 몰래 보거나 친구 관계를 내 마음대로 막는 것은 하고 싶지 않다.','respect'],
['이 사람이 아파 입원한다면 내 일정이 허락하는 만큼 병원에서 오래 곁을 지켜주고 싶다.','care'],['한밤중이라도 이 사람이 크게 아파 혼자 병원에 가기 어렵다면 함께 가줄 수 있다.','care'],['이 사람이 큰 병이나 사고로 혼자 씻지 못한다면 씻는 일을 직접 도와줄 수 있을 것 같다.','care'],['이 사람이 혼자 화장실을 쓰지 못할 정도로 아프다면 대소변을 치우는 일도 감당해볼 수 있을 것 같다.','care'],
['이 사람에게 맛있는 밥이나 작은 선물을 사주는 돈은 크게 아깝지 않다.','money'],['이 사람이 갑자기 경제적으로 어려워진다면 내 생활을 무너뜨리지 않는 범위에서 돈이나 생활을 도와주고 싶다.','money'],['이 사람의 수입이나 재산이 지금보다 크게 줄어도 그 이유만으로 마음이 사라지지는 않을 것 같다.','money'],['내가 훨씬 돈을 많이 벌게 되어도 돈 때문에 이 사람을 낮게 보거나 더 조건 좋은 사람을 찾고 싶지는 않을 것 같다.','money'],
['크게 싸워 화가 나도 바로 끝내기보다 시간을 두고 이야기해서 관계를 다시 풀어보고 싶다.','respect'],['내가 잘못한 것이 분명하다면 자존심이 상해도 먼저 미안하다고 말할 수 있다.','respect'],['이 사람에게 마음에 들지 않는 점이 있어도 억지로 내 뜻대로 바꾸기보다 서로 맞춰갈 방법을 찾고 싶다.','respect'],['내가 힘들고 피곤한 날에도 이 사람에게 정말 큰일이 생기면 가능한 범위에서 달려가 돕고 싶다.','care'],
['5년, 10년 뒤의 내 생활을 떠올릴 때 이 사람이 그 안에 함께 있는 모습이 자연스럽게 그려진다.','future'],['나이가 들어 이 사람의 외모가 많이 변하고 머리가 희어져도 다정하게 안아주고 싶을 것 같다.','future'],['이 사람이 늙어서 걷거나 움직이는 것이 불편해져도 함께 생활하며 도와주고 싶다.','future'],['내가 건강한데 이 사람이 오랫동안 아프게 되더라도 쉽게 떠나기보다 가능한 방법을 찾아 함께하고 싶다.','future'],['설렘, 스킨십, 생활, 돈, 병간호, 늙어가는 모습까지 모두 생각해도 나는 이 사람을 내 삶의 중요한 사람으로 오래 곁에 두고 싶다.','future']
];
const labels=['전혀 아니다','별로 아니다','잘 모르겠다','그렇다','정말 그렇다'];
let current=0, selected=null, answers=Array(Q.length).fill(null), person='그 사람';
function beginTest(){person=document.getElementById('name').value.trim()||'그 사람';document.getElementById('startScreen').style.display='none';document.getElementById('result').style.display='none';document.getElementById('test').style.display='block';renderQuestion();window.scrollTo(0,0)}
function renderQuestion(){selected=answers[current];document.getElementById('counter').textContent=`${current+1} / ${Q.length}`;document.getElementById('bar').style.width=`${(current+1)/Q.length*100}%`;document.getElementById('q').textContent=Q[current][0].replaceAll('이 사람',person);document.getElementById('choices').innerHTML=labels.map((x,k)=>`<button class="choice ${selected===k+1?'on':''}" onclick="pick(${k+1})">${k+1}. ${x}</button>`).join('')}
function pick(v){selected=v;document.querySelectorAll('.choice').forEach((b,k)=>b.classList.toggle('on',k+1===v))}
function prevQuestion(){if(current>0){current--;renderQuestion();window.scrollTo(0,0)}}
function saveNext(){if(selected===null){alert('먼저 답을 하나 골라주세요 💗');return}answers[current]=selected;if(current<Q.length-1){current++;renderQuestion();window.scrollTo(0,0)}else showResult()}
function avg(keys){let s=0,n=0;Q.forEach((q,j)=>{if(keys.includes(q[1])){s+=answers[j];n++}});return Math.round(((s/n)-1)/4*100)}
function showResult(){const m={애착:avg(['attach']),연인끌림:avg(['romance']),성적끌림:avg(['sexual']),돌봄:avg(['care']),금전·현실:avg(['money']),존중·갈등회복:avg(['respect']),미래·노후:avg(['future']),질투:avg(['jealous'])};const love=Math.round(m.애착*.16+m.연인끌림*.16+m.성적끌림*.10+m.돌봄*.15+m['금전·현실']*.10+m['존중·갈등회복']*.12+m['미래·노후']*.21);let type='친구에 가까운 마음 🌼';if(m.연인끌림<45&&m.성적끌림<40&&m.애착>60)type='아주 소중한 친구 💛';else if(m.연인끌림>=70&&m.성적끌림>=65&&m['미래·노후']<50)type='강하게 끌리는 사이 🔥';else if(love>=85&&m.연인끌림>=65&&m['미래·노후']>=70)type='애인이자 가장 친한 친구 💞';else if(love>=70&&m.연인끌림>=55)type='깊어지는 연인 ❤️';else if(love>=50&&m.연인끌림>=45)type='친구와 애인 사이 💗';else if(m.애착>=50)type='호감과 정이 큰 사이 🌷';document.getElementById('test').style.display='none';document.getElementById('result').style.display='block';document.getElementById('who').textContent=`${person}을(를) 떠올린 나의 마음`;document.getElementById('score').textContent=`사랑 ${love}%`;document.getElementById('type').textContent=type;document.getElementById('metrics').innerHTML=Object.entries(m).map(([k,v])=>`<div class="metric"><div class="metricTop"><span>${k}</span><span>${v}%</span></div><div class="track"><div class="fill" style="width:${v}%"></div></div></div>`).join('');const highs=Object.entries(m).filter(([k])=>k!=='질투').sort((a,b)=>b[1]-a[1]);const high=highs[0],low=highs[highs.length-1];const romance=m.연인끌림>=65&&m.성적끌림>=55?'친구에게 느끼는 정을 넘어 연인으로 가까워지고 싶은 마음이 뚜렷합니다. 키스나 신체적 친밀감도 관계의 한 부분으로 받아들이는 편입니다.':m.연인끌림<45&&m.성적끌림<45?'아끼는 마음과 연애 감정은 같은 것이 아닙니다. 현재 답에서는 키스나 성적인 친밀감보다 정서적 친밀감이 더 두드러져 깊은 우정이나 가족 같은 정과도 구별해볼 필요가 있습니다.':'연애적 끌림은 있지만 아주 강하거나 한 방향으로만 모이지는 않았습니다. 관계가 깊어지며 감정의 성격이 달라질 수도 있습니다.';const future=m['미래·노후']>=70?'지금의 설렘뿐 아니라 늙고 아픈 현실까지 관계의 일부로 생각하는 경향이 강합니다. 장기적인 동반자 관계를 상상하는 힘이 큰 편입니다.':'현재의 감정에 비해 먼 미래나 노후를 함께 감당하려는 마음은 상대적으로 조심스럽습니다. 이것만으로 사랑이 없다고 볼 수는 없습니다.';const jealousy=m.질투>=75?'질투 반응은 높은 편입니다. 질투는 애착과 상실에 대한 걱정을 보여줄 수 있지만 그 자체가 사랑의 크기는 아닙니다. 존중 점수와 함께 보는 것이 중요합니다.':m.질투>=40?'상대가 다른 사람에게 가까워질 때 어느 정도 신경 쓰이는 편이지만 질투 하나가 전체 감정을 지배하는 수준은 아닙니다.':'독점 욕구는 낮은 편입니다. 질투가 적다고 사랑이 적은 것은 아니므로 애착·연인 끌림·돌봄 점수와 함께 봐야 합니다.';document.getElementById('report').innerHTML=`<div class="report"><h2>💌 전체 해석</h2><p><b>${person}</b>에 대한 사랑 지수는 <b>${love}%</b>이며, 현재 응답 패턴은 <b>${type}</b>에 가장 가깝습니다.</p><p>${romance}</p><h2>🫶 사랑의 깊이</h2><p>가장 높은 영역은 <b>${high[0]} ${high[1]}%</b>, 가장 낮은 영역은 <b>${low[0]} ${low[1]}%</b>입니다. 사랑은 설렘 하나가 아니라 친밀감, 신체적 끌림, 돌봄, 현실 감각, 존중, 미래를 함께 보려는 마음이 서로 다른 비율로 섞여 나타납니다.</p><h2>🏠 현실과 미래</h2><p>${future}</p><h2>👀 질투와 관계 안전감</h2><p>${jealousy}</p><h2>💗 한 줄 정리</h2><p>이 결과는 상대가 실제로 나를 어떻게 생각하는지를 읽는 검사가 아니라, <b>내가 ${person}에게 느끼는 감정의 모양</b>을 정리한 것입니다. 점수보다 어떤 영역이 높고 낮은지를 함께 보는 것이 더 의미 있습니다.</p></div>`;window.scrollTo(0,0)}
function restart(){current=0;selected=null;answers=Array(Q.length).fill(null);document.getElementById('result').style.display='none';document.getElementById('startScreen').style.display='block';window.scrollTo(0,0)}
</script>
</body>
</html>
