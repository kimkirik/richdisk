<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090518">
  <meta name="description" content="음악 취향을 분석하고 닮은 음악을 발견하는 닮은소리">
  <title>닮은소리</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}
    body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 28%,#27145c 0,#0d0824 45%,#05030c 100%);color:#f6f2ff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
    main{width:min(440px,100%);text-align:center}.logo{width:112px;height:112px;border-radius:27px;box-shadow:0 0 48px #935cff80}
    h1{margin:20px 0 7px;font-size:32px;letter-spacing:-1px}p{margin:0;color:#c5b9dd;line-height:1.6}
    .bar{height:5px;margin:24px 0 18px;overflow:hidden;border-radius:99px;background:#24183c}.bar::after{content:"";display:block;width:45%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#9c5cff,#41ddff);animation:move 1s ease-in-out infinite alternate}
    a{display:inline-flex;justify-content:center;width:100%;padding:14px 18px;border-radius:15px;background:linear-gradient(135deg,#8b55ff,#29cde7);color:#fff;text-decoration:none;font-weight:800;box-shadow:0 12px 35px #6538c755}
    small{display:block;margin-top:14px;color:#8f82a9}@keyframes move{to{transform:translateX(122%)}}
  </style>
  <script>setTimeout(()=>location.replace('https://similar-sound.kimkirik.chatgpt.site/'),700)</script>
</head>
<body>
  <main>
    <img class="logo" src="./icon.svg" alt="닮은소리 아이콘">
    <h1>닮은소리</h1>
    <p>음악 취향과 닮은 음악을 연결하고 있어요.</p>
    <div class="bar" aria-hidden="true"></div>
    <a href="https://similar-sound.kimkirik.chatgpt.site/">닮은소리 바로 열기</a>
    <small>자동으로 열리지 않을 때 버튼을 눌러주세요.</small>
  </main>
  <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js')</script>
</body>
</html>
