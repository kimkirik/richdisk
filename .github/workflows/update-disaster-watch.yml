name: Update Disaster Watch Data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */12 * * *"
  push:
    branches: [main]
    paths:
      - "disaster-watch-100/scripts/refresh-data.mjs"
      - ".github/workflows/update-disaster-watch.yml"

permissions:
  contents: write

concurrency:
  group: update-disaster-watch-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh public video index
        run: node disaster-watch-100/scripts/refresh-data.mjs
      - name: Save refreshed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add disaster-watch-100/data.js
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh disaster video index"
            git pull --rebase origin main
            git push
          fi
