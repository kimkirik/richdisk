name: Refresh Asan rental notices

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check official rental sources
        run: node --experimental-strip-types asan-rental-watch/scripts/update-notices.ts

      - name: Save refreshed notice archive
        run: |
          git config user.name "asan-rental-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add asan-rental-watch/data/notices.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Asan rental notices"
            git pull --rebase
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
