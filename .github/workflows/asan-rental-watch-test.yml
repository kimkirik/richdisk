name: Verify Asan rental backup
on:
  pull_request:
    paths: ['asan-rental-watch/**', '.github/workflows/asan-rental-watch-*.yml']
  push:
    branches: ['main']
    paths: ['asan-rental-watch/push-service/**', 'asan-rental-watch/independent-server/**', '.github/workflows/asan-rental-watch-test.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ['push-service', 'independent-server']
    defaults:
      run:
        working-directory: asan-rental-watch/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test && npm run typecheck && npm run build
